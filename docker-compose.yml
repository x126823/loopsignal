services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loopsignal
      POSTGRES_PASSWORD: loopsignal
      POSTGRES_DB: loopsignal
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopsignal"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
